[theme]
base = "dark"
primaryColor = "#24C77B"
backgroundColor = "#080F0D"
secondaryBackgroundColor = "#14231D"
textColor = "#F3F7F5"
borderColor = "#284137"
font = "sans-serif"
baseRadius = "0.75rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#14231D"
dataframeHeaderTextColor = "#F3F7F5"

[theme.sidebar]
backgroundColor = "#061C15"
secondaryBackgroundColor = "#101B17"

# Reuse local credentials without copying them into this worktree.
# A worktree-local file, if present, takes precedence over the shared file.
[secrets]
files = ["../where-next/.streamlit/secrets.toml", ".streamlit/secrets.toml"]
